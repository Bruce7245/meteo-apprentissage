name: Diagnostic recherche LBA 29-75-974

on:
  push:
    branches:
      - test/lba-export-2026-10-01
    paths:
      - .github/workflows/test-lba-export-2026-10-01.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare-readonly:
    name: Verifier recherche actuelle 29-75-974 (lecture seule)
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 25

    steps:
      - name: Recuperer les scripts sur la branche de test
        uses: actions/checkout@v4

      - name: Authentifier Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_FIREBASE_DEPLOYER_KEY }}

      - name: Installer gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: meteo-apprentissage

      - name: Installer les lecteurs streaming et Firestore
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/lba-compare-venv"
          "$RUNNER_TEMP/lba-compare-venv/bin/pip" install --disable-pip-version-check --quiet 'ijson==3.4.0.post0' 'google-cloud-firestore==2.21.0'

      - name: Interroger la recherche directement sur trois departements (read-only)
        shell: bash
        run: |
          set -euo pipefail
          TOKEN="$(gcloud secrets versions access latest --secret=API_APPRENTISSAGE_TOKEN --project=meteo-apprentissage)"
          test -n "$TOKEN"
          echo "::add-mask::$TOKEN"
          API_APPRENTISSAGE_TOKEN="$TOKEN" "$RUNNER_TEMP/lba-compare-venv/bin/python" scripts/diagnose-lba-search-29-75-974.py
