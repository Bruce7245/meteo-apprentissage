name: Test ponctuel export LBA

on:
  push:
    branches:
      - test/lba-export-2026-10-01
    paths:
      - .github/workflows/test-lba-export-2026-10-01.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-export:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_FIREBASE_DEPLOYER_KEY }}

      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: meteo-apprentissage

      - name: Tester export national
        shell: bash
        run: |
          set -euo pipefail
          TOKEN="$(gcloud secrets versions access latest --secret=API_APPRENTISSAGE_TOKEN --project=meteo-apprentissage)"
          echo "::add-mask::$TOKEN"
          API_APPRENTISSAGE_TOKEN="$TOKEN" node scripts/test-lba-export-2026-10-01.mjs
