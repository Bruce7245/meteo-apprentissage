name: Audit read-only collectes 23h59 et 04h - volumes reels

on:
  push:
    branches:
      - audit/collectes-2026-10-09-4h
    paths:
      - .github/workflows/audit-collectes-2026-10-09-4h.yml
      - functions/scripts/audit-collectes-2026-10-10.cjs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Verifier Firestore et les logs des Functions
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 18

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Installer Firebase Admin
        run: |
          npm ci --prefix functions
          node --check functions/scripts/audit-collectes-2026-10-10.cjs

      - name: Authentification Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_FIREBASE_DEPLOYER_KEY }}

      - name: Inspecter Firestore en lecture seule
        run: node functions/scripts/audit-collectes-2026-10-10.cjs

