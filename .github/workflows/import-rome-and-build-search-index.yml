name: Import ROME and build search index

on:
  push:
    branches:
      - feat/occupation-search-37
    paths:
      - .github/workflows/import-rome-and-build-search-index.yml
      - scripts/import-rome-reference.mjs
      - functions/build-occupation-search-index.cjs

permissions:
  contents: read

concurrency:
  group: import-rome-and-build-search-index
  cancel-in-progress: false

jobs:
  import-and-build:
    name: Import ROME and build public search index
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install Functions dependencies
        run: npm ci --prefix functions

      - name: Validate importer and builder syntax
        run: |
          node --check scripts/import-rome-reference.mjs
          node --check functions/build-occupation-search-index.cjs

      - name: Run ROME parser tests
        run: node --test functions/test/rome-open-data.test.cjs

      - name: Dry-run official ROME import
        env:
          DRY_RUN: "1"
        run: node scripts/import-rome-reference.mjs

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_FIREBASE_DEPLOYER_KEY }}

      - name: Import and publish official ROME reference
        run: node scripts/import-rome-reference.mjs

      - name: Build and publish public occupation search index
        run: node functions/build-occupation-search-index.cjs
