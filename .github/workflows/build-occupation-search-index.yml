name: Build occupation search index

on:
  push:
    branches:
      - feat/occupation-search-37
    paths:
      - .github/workflows/build-occupation-search-index.yml

permissions:
  contents: read

concurrency:
  group: build-occupation-search-index
  cancel-in-progress: false

jobs:
  build:
    name: Build public occupation search index
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install Functions dependencies
        run: npm ci --prefix functions

      - name: Validate builder syntax
        run: node --check functions/build-occupation-search-index.cjs

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_FIREBASE_DEPLOYER_KEY }}

      - name: Build and publish public occupation search index
        run: node functions/build-occupation-search-index.cjs
