name: Import INSEE population

on:
  push:
    branches:
      - feat/occupation-search-37
    paths:
      - .github/workflows/import-insee-population.yml
      - scripts/import-insee-population.mjs

permissions:
  contents: read

concurrency:
  group: import-insee-population
  cancel-in-progress: false

jobs:
  import:
    name: Import INSEE population reference
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Validate importer syntax
        run: node --check scripts/import-insee-population.mjs

      - name: Run INSEE parser tests
        run: node --test functions/test/insee-population.test.cjs

      - name: Inspect INSEE workbook structure
        env:
          INSEE_POPULATION_URL: "https://www.insee.fr/fr/statistiques/fichier/8721456/estim-pop-dep-sexe-aq-1975-2026.xlsx"
        run: |
          node --input-type=module <<'NODE'
          import XLSX from 'xlsx';

          const response = await fetch(process.env.INSEE_POPULATION_URL);
          if (!response.ok) throw new Error(`INSEE HTTP ${response.status}`);
          const buffer = Buffer.from(await response.arrayBuffer());
          const workbook = XLSX.read(buffer, { type: 'buffer', cellDates: false });

          console.log('SHEETS=' + JSON.stringify(workbook.SheetNames));

          const target = workbook.SheetNames.find((name) => String(name).trim() === '2026');
          if (!target) throw new Error('2026 sheet missing');

          const sheet = workbook.Sheets[target];
          console.log('REF=' + String(sheet['!ref'] || ''));
          console.log('MERGES=' + JSON.stringify((sheet['!merges'] || []).slice(0, 20)));

          const rows = XLSX.utils.sheet_to_json(sheet, {
            header: 1,
            raw: true,
            defval: null,
          });

          rows.slice(0, 50).forEach((row, index) => {
            const preview = Array.isArray(row) ? row.slice(0, 24) : row;
            console.log(`ROW_${index + 1}=${JSON.stringify(preview)}`);
          });
          NODE

      - name: Dry-run INSEE population import
        env:
          DRY_RUN: "1"
          POPULATION_REFERENCE_YEAR: "2026"
        run: node scripts/import-insee-population.mjs

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_FIREBASE_DEPLOYER_KEY }}

      - name: Import and publish INSEE population
        env:
          POPULATION_REFERENCE_YEAR: "2026"
        run: node scripts/import-insee-population.mjs

      - name: Verify published population metadata
        run: |
          node --input-type=module <<'NODE'
          import { getApps, initializeApp } from 'firebase-admin/app';
          import { getFirestore } from 'firebase-admin/firestore';

          if (getApps().length === 0) initializeApp({ projectId: 'meteo-apprentissage' });
          const db = getFirestore();
          const snap = await db.collection('departmentPopulationReferenceMeta').doc('current').get();

          if (!snap.exists) {
            throw new Error('departmentPopulationReferenceMeta/current is missing after import');
          }

          const data = snap.data() || {};
          const summary = {
            runId: data.runId || null,
            referenceYear: data.referenceYear || null,
            departmentsCount: data.departmentsCount || null,
            sourceDataset: data.sourceDataset || null,
            sourceVersion: data.sourceVersion || null,
          };

          console.log(JSON.stringify(summary, null, 2));

          if (Number(data.referenceYear) !== 2026) {
            throw new Error('Published population reference year is not 2026');
          }

          if (Number(data.departmentsCount) !== 101) {
            throw new Error('Published population departments count is not 101');
          }
          NODE
