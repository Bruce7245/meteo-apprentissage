name: Admin vigilance backend tests

on:
  push:
    branches:
      - feat/admin-vigilance-backend-58
    paths:
      - functions/admin-occupation-vigilance-config.cjs
      - functions/lib/occupation-search.cjs
      - functions/lib/occupation-vigilance.cjs
      - functions/test/admin-occupation-vigilance-config.test.cjs
      - functions/test/occupation-vigilance.test.cjs
      - functions/index.js
      - .github/workflows/admin-vigilance-backend-tests.yml
  pull_request:
    branches:
      - main
    paths:
      - functions/admin-occupation-vigilance-config.cjs
      - functions/lib/occupation-search.cjs
      - functions/lib/occupation-vigilance.cjs
      - functions/test/admin-occupation-vigilance-config.test.cjs
      - functions/test/occupation-vigilance.test.cjs
      - functions/index.js
      - .github/workflows/admin-vigilance-backend-tests.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Validate admin vigilance backend
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install Functions dependencies
        run: npm ci --prefix functions

      - name: Validate syntax
        run: |
          set -euo pipefail
          node --check functions/index.js
          node --check functions/admin-occupation-vigilance-config.cjs
          node --check functions/lib/occupation-search.cjs
          node --check functions/lib/occupation-vigilance.cjs

      - name: Run targeted unit tests
        working-directory: functions
        run: |
          set -euo pipefail
          node --test             test/admin-occupation-vigilance-config.test.cjs             test/occupation-vigilance.test.cjs

