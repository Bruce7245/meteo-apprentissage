name: Rollback manual - Complement LBA 04h #103

on:
  workflow_dispatch:
    inputs:
      date:
        description: "Date du relevé à restaurer (AAAA-MM-JJ)"
        required: true
        type: string
      confirmation:
        description: "Taper ROLLBACK_COMPLEMENT_AAAA-MM-JJ"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: lba-complement-publish
  cancel-in-progress: false

jobs:
  rollback:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    env:
      COMPLEMENT_DATE: ${{ inputs.date }}
      ROLLBACK_CONFIRMATION: ${{ inputs.confirmation }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - name: Verifier confirmation et dependances
        shell: bash
        run: |
          set -euo pipefail
          test "$ROLLBACK_CONFIRMATION" = "ROLLBACK_COMPLEMENT_$COMPLEMENT_DATE"
          npm ci --prefix functions
          node --check functions/scripts/rollback-lba-daily-complement.cjs
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_FIREBASE_DEPLOYER_KEY }}
      - name: Restaurer ancien pointeur de la veille
        run: node functions/scripts/rollback-lba-daily-complement.cjs
