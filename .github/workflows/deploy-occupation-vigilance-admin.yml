name: Deploy occupation vigilance admin

on:
  workflow_dispatch:
    inputs:
      confirm_production:
        description: "Type DEPLOY to confirm production deployment"
        required: true
        default: ""
        type: string
      deploy_functions:
        description: "Deploy targeted occupation vigilance admin Functions"
        required: true
        default: true
        type: boolean
      deploy_rules:
        description: "Deploy Firestore rules"
        required: true
        default: false
        type: boolean
      deploy_hosting:
        description: "Build and deploy Hosting"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  deploy:
    name: Controlled occupation vigilance deploy
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20

    steps:
      - name: Enforce deployment branch and confirmation
        shell: bash
        env:
          CONFIRM_PRODUCTION: ${{ inputs.confirm_production }}
          DEPLOY_HOSTING: ${{ inputs.deploy_hosting }}
        run: |
          set -euo pipefail

          if [ "$GITHUB_REF_NAME" != "feat/occupation-search-37" ]; then
            echo "Deployment refused from branch: $GITHUB_REF_NAME" >&2
            echo "Expected: feat/occupation-search-37" >&2
            exit 1
          fi

          if [ "$CONFIRM_PRODUCTION" != "DEPLOY" ]; then
            echo "Production deployment requires confirm_production=DEPLOY" >&2
            exit 1
          fi

          if [ "$DEPLOY_HOSTING" = "true" ]; then
            echo "Hosting deployment is intentionally blocked from feat/occupation-search-37." >&2
            echo "This branch is highly divergent from main; deploy Hosting only from a dedicated reconciled branch." >&2
            exit 1
          fi

      - name: Require at least one target
        shell: bash
        env:
          DEPLOY_FUNCTIONS: ${{ inputs.deploy_functions }}
          DEPLOY_RULES: ${{ inputs.deploy_rules }}
          DEPLOY_HOSTING: ${{ inputs.deploy_hosting }}
        run: |
          set -euo pipefail
          if [ "$DEPLOY_FUNCTIONS" != "true" ] &&              [ "$DEPLOY_RULES" != "true" ] &&              [ "$DEPLOY_HOSTING" != "true" ]; then
            echo "Select at least one deployment target." >&2
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      - name: Install Functions dependencies
        if: ${{ inputs.deploy_functions }}
        run: npm ci --prefix functions

      - name: Validate targeted backend
        if: ${{ inputs.deploy_functions }}
        working-directory: functions
        run: |
          set -euo pipefail
          node --check admin-occupation-vigilance-config.cjs
          node --check index.js
          node --test             test/admin-occupation-vigilance-config.test.cjs             test/occupation-history.test.cjs             test/occupation-vigilance.test.cjs             test/occupation-calibration.test.cjs             test/occupation-vigilance-precompute.test.cjs             test/occupation-vigilance-daily.test.cjs             test/occupation-vigilance-projection.test.cjs

      - name: Validate Firestore rules file
        if: ${{ inputs.deploy_rules }}
        shell: bash
        run: |
          set -euo pipefail
          test -s firestore.rules
          grep -q "occupationVigilanceConfigDrafts" firestore.rules
          grep -q "occupationVigilanceConfigAudit" firestore.rules
          grep -q "occupationVigilanceSnapshots" firestore.rules

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_FIREBASE_DEPLOYER_KEY }}

      - name: Deploy targeted Functions
        if: ${{ inputs.deploy_functions }}
        shell: bash
        run: |
          set -euo pipefail
          npx --yes firebase-tools@latest deploy             --project meteo-apprentissage             --only "functions:previewOccupationVigilanceConfigHttp,functions:getOccupationVigilanceConfigHistoryHttp,functions:compareOccupationVigilanceConfigsHttp,functions:activateOccupationVigilanceConfigHttp"             --non-interactive

      - name: Deploy Firestore rules
        if: ${{ inputs.deploy_rules }}
        shell: bash
        run: |
          set -euo pipefail
          npx --yes firebase-tools@latest deploy             --project meteo-apprentissage             --only firestore:rules             --non-interactive

      - name: Verify admin Functions are reachable
        if: ${{ inputs.deploy_functions }}
        shell: bash
        run: |
          set -euo pipefail

          check_unauthenticated() {
            name="$1"
            url="$2"
            body_file="$(mktemp)"
            status="$(curl --silent --show-error               --output "$body_file"               --write-out "%{http_code}"               --max-time 30               --request POST               --header "Content-Type: application/json"               --data '{}'               "$url")"

            echo "$name -> HTTP $status"
            cat "$body_file"
            echo

            if [ "$status" != "401" ]; then
              echo "Unexpected status for $name: expected 401 without auth." >&2
              exit 1
            fi
          }

          check_unauthenticated             "previewOccupationVigilanceConfigHttp"             "https://europe-west1-meteo-apprentissage.cloudfunctions.net/previewOccupationVigilanceConfigHttp"

          check_unauthenticated             "getOccupationVigilanceConfigHistoryHttp"             "https://europe-west1-meteo-apprentissage.cloudfunctions.net/getOccupationVigilanceConfigHistoryHttp"

          check_unauthenticated             "compareOccupationVigilanceConfigsHttp"             "https://europe-west1-meteo-apprentissage.cloudfunctions.net/compareOccupationVigilanceConfigsHttp"

          check_unauthenticated             "activateOccupationVigilanceConfigHttp"             "https://europe-west1-meteo-apprentissage.cloudfunctions.net/activateOccupationVigilanceConfigHttp"

      - name: Deployment summary
        shell: bash
        env:
          DEPLOY_FUNCTIONS: ${{ inputs.deploy_functions }}
          DEPLOY_RULES: ${{ inputs.deploy_rules }}
          DEPLOY_HOSTING: ${{ inputs.deploy_hosting }}
        run: |
          {
            echo "## Occupation vigilance deployment"
            echo
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Branch: \`$GITHUB_REF_NAME\`"
            echo "- Functions: \`$DEPLOY_FUNCTIONS\`"
            echo "- Firestore rules: \`$DEPLOY_RULES\`"
            echo "- Hosting requested: \`$DEPLOY_HOSTING\` (blocked on this branch)"
            echo
            echo "### Safety"
            echo "- No occupation vigilance run was triggered."
            echo "- No configuration was activated."
            echo "- No scheduler was modified."
            echo "- No public map was recalculated or republished by this workflow."
          } >> "$GITHUB_STEP_SUMMARY"
