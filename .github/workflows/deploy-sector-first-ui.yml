name: Deploy sector-first occupation UI

on:
  push:
    branches:
      - release/sector-first-ui-74
    paths:
      - .github/workflows/deploy-sector-first-ui.yml

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 25

    env:
      EXPECTED_MAIN_SHA: 79a420ed38d853575bb886ea0ae2d354f950d65c

    steps:
      - name: Checkout exact main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Verify source commit
        shell: bash
        run: |
          set -euo pipefail
          current_sha="$(git rev-parse HEAD)"
          echo "main -> $current_sha"

          if [ "$current_sha" != "$EXPECTED_MAIN_SHA" ]; then
            echo "Main moved since release authorization." >&2
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      - name: Install dependencies
        run: |
          set -euo pipefail
          npm ci
          npm ci --prefix functions

      - name: Validate application
        run: |
          set -euo pipefail
          npm run lint
          npm run build
          node --check functions/index.js
          npm run test:unit --prefix functions

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_FIREBASE_DEPLOYER_KEY }}

      - name: Deploy sector APIs
        shell: bash
        run: |
          set -euo pipefail
          npx --yes firebase-tools@latest deploy \
            --project meteo-apprentissage \
            --only "functions:getPublicOccupationDomainsHttp,functions:getPublicOccupationDomainOccupationsHttp" \
            --non-interactive

      - name: Smoke sector APIs
        shell: bash
        run: |
          set -euo pipefail

          base="https://europe-west1-meteo-apprentissage.cloudfunctions.net"

          curl --silent --show-error --fail \
            --max-time 30 \
            "$base/getPublicOccupationDomainsHttp" \
            > /tmp/domains.json

          curl --silent --show-error --fail \
            --max-time 30 \
            "$base/getPublicOccupationDomainOccupationsHttp?domain=G12" \
            > /tmp/g12.json

          node <<'NODE'
          const fs = require('node:fs');

          const domains = JSON.parse(
            fs.readFileSync('/tmp/domains.json', 'utf8')
          );
          const g12 = JSON.parse(
            fs.readFileSync('/tmp/g12.json', 'utf8')
          );

          if (!domains?.ok || !Array.isArray(domains.domains)) {
            throw new Error('Invalid domains payload');
          }

          if (
            !g12?.ok ||
            !Array.isArray(g12.occupations) ||
            g12.occupations.length === 0
          ) {
            throw new Error('Invalid G12 payload');
          }

          for (const occupation of g12.occupations) {
            if (
              !['available', 'insufficient_data'].includes(
                occupation.dataStatus
              )
            ) {
              throw new Error(
                'Missing/invalid dataStatus for ' +
                  occupation.romeCode
              );
            }
          }

          const counts = g12.occupations.reduce(
            (acc, occupation) => {
              acc[occupation.dataStatus] =
                (acc[occupation.dataStatus] || 0) + 1;
              return acc;
            },
            {}
          );

          console.log(JSON.stringify({
            domainsCount: domains.domains.length,
            g12OccupationsCount: g12.occupations.length,
            occupationDataDate: g12.occupationDataDate || null,
            statusCounts: counts,
          }, null, 2));
          NODE

      - name: Deploy Hosting
        shell: bash
        run: |
          set -euo pipefail
          npx --yes firebase-tools@latest deploy \
            --project meteo-apprentissage \
            --only hosting \
            --non-interactive

      - name: Smoke Hosting
        shell: bash
        run: |
          set -euo pipefail

          for url in \
            "https://meteo-apprentissage.web.app/metiers" \
            "https://meteo-apprentissage.web.app/metiers?domain=G12" \
            "https://meteo-apprentissage.web.app/metiers?domain=G12&rome=G1204"
          do
            status="$(curl --silent --show-error \
              --location \
              --output /dev/null \
              --write-out "%{http_code}" \
              --max-time 30 \
              "$url")"

            echo "$url -> HTTP $status"

            if [ "$status" != "200" ]; then
              exit 1
            fi
          done

      - name: Summary
        if: always()
        run: |
          {
            echo "## Sector-first UI release"
            echo
            echo "- Source: main @ \`$EXPECTED_MAIN_SHA\`"
            echo "- 2 public sector APIs"
            echo "- Firebase Hosting"
            echo
            echo "### Excluded"
            echo "- No sector vigilance engine deployment"
            echo "- No config validation"
            echo "- No sector publication"
            echo "- No scheduler"
            echo "- No Firestore rules"
          } >> "$GITHUB_STEP_SUMMARY"
