name: CI

on:
  push:
    branches:
      - main
      - "agent/**"
      - "fix/**"
      - "feat/**"
      - "ops/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Build and validate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Functions dependencies
        run: npm ci --prefix functions

      - name: Lint source code
        run: npm run lint

      - name: Build frontend
        run: npm run build

      - name: Verify SEO HTML, canonicals and Hosting routes
        run: node --test scripts/test-seo-pages.mjs

      - name: Verify departmental SEO eligibility and static rendering
        run: node --test scripts/test-department-seo.mjs

      - name: Verify scrollable occupation catalogue layout
        run: node --test scripts/test-editorial-catalogue-scroll.mjs

      - name: Verify Vite modules and Hosting safeguards
        run: |
          node --test scripts/test-hosting-assets.mjs
          node scripts/verify-hosting-build.mjs

      - name: Regressions KPI Chakra SSR
        run: npm run test:ui:kpi

      - name: Test Admin simulation exploratory color bands and national map
        run: node --test scripts/test-admin-simulation-colors.mjs scripts/test-admin-national-simulation-map.mjs scripts/test-admin-published-comparison-map.mjs

      - name: Validate Canva editorial prompts
        run: npm run test:canva-prompt

      - name: Validate Functions syntax
        run: node --check functions/index.js

      - name: Test Functions unit logic
        run: npm run test:unit --prefix functions
