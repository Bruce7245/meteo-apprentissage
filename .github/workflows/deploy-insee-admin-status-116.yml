name: Publier suivi admin INSEE securise #116

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/deploy-insee-admin-status-116.yml

permissions:
  contents: read

concurrency:
  group: insee-admin-monitor-release-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deployer uniquement API admin INSEE et Hosting
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json
      - name: Validate code and security tests
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm ci --prefix functions
          npm run lint
          node --check functions/lib/insee-admin-job-status.cjs
          node --check functions/index.js
          node --test functions/test/insee-admin-job-status.test.cjs
          npm run test:unit --prefix functions
          npm run test:ui:kpi
          npm run test:canva-prompt
          npm run build
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_FIREBASE_DEPLOYER_KEY }}
      - name: Deploy the single read-only INSEE status Function
        shell: bash
        run: |
          npx --yes firebase-tools@latest deploy \
            --project meteo-apprentissage \
            --only "functions:getInseeCollectionStatusHttp" \
            --non-interactive
      - name: Verify the endpoint rejects anonymous clients
        shell: bash
        run: |
          set -euo pipefail
          output="$(mktemp)"
          status="$(curl --silent --show-error --max-time 40 \
            --request POST \
            --header "Content-Type: application/json" \
            --data '{}' \
            --output "$output" \
            --write-out '%{http_code}' \
            https://europe-west1-meteo-apprentissage.cloudfunctions.net/getInseeCollectionStatusHttp)"
          echo "Anonymous INSEE status endpoint: HTTP $status"
          test "$status" = "401"
          node -e "const f=require('fs');const x=JSON.parse(f.readFileSync(process.argv[1],'utf8'));if(x.ok!==false)process.exit(1)" "$output"
      - name: Deploy Hosting only
        shell: bash
        run: |
          npx --yes firebase-tools@latest deploy \
            --project meteo-apprentissage --only hosting --non-interactive
      - name: Smoke test admin company route
        shell: bash
        run: |
          set -euo pipefail
          output="$(mktemp)"
          status="$(curl --silent --show-error --location \
            --max-time 40 --output "$output" --write-out '%{http_code}' \
            https://meteo-apprentissage.web.app/admin/entreprises)"
          echo "Admin Entreprises: HTTP $status"
          test "$status" = "200"
          grep -q '<div id="root"></div>' "$output"
      - name: Report scope
        if: always()
        shell: bash
        run: |
          {
            echo "## Admin INSEE status"
            echo "- Commit $GITHUB_SHA"
            echo "- Deployed only getInseeCollectionStatusHttp and Firebase Hosting"
            echo "- No Firestore rules deploy, no change to scheduled import or vigilances"
            echo "- Anonymous clients must receive HTTP 401"
          } >> "$GITHUB_STEP_SUMMARY"
