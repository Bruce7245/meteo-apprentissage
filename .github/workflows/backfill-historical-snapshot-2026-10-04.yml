name: Backfill historical snapshot 2026-10-04

on:
  push:
    branches:
      - feat/occupation-search-37
    paths:
      - .github/workflows/backfill-historical-snapshot-2026-10-04.yml
      - functions/scripts/backfill-historical-daily-offer-snapshot.cjs
      - functions/lib/daily-offer-snapshot.cjs
      - functions/test/daily-offer-snapshot.test.cjs

permissions:
  contents: read

concurrency:
  group: backfill-historical-snapshot-2026-10-04
  cancel-in-progress: false

jobs:
  backfill:
    name: Rebuild Oct 4 snapshot and calibration draft
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install Functions dependencies
        run: npm ci --prefix functions

      - name: Validate scripts
        run: |
          node --check functions/scripts/backfill-historical-daily-offer-snapshot.cjs
          node --check functions/build-occupation-context-stats.cjs
          node --check functions/scripts/build-occupation-calibration.cjs

      - name: Run Functions unit tests
        run: npm run test:unit --prefix functions

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_FIREBASE_DEPLOYER_KEY }}

      - name: Dry-run historical snapshot reconstruction
        working-directory: functions
        run: |
          node scripts/backfill-historical-daily-offer-snapshot.cjs \
            --date=2026-10-04 \
            --expected-departments=101

      - name: Write and verify historical snapshot
        working-directory: functions
        run: |
          node scripts/backfill-historical-daily-offer-snapshot.cjs \
            --date=2026-10-04 \
            --expected-departments=101 \
            --write

      - name: Build occupation contexts for Oct 4
        working-directory: functions
        run: node build-occupation-context-stats.cjs 2026-10-04

      - name: Verify Oct 4 occupation contexts
        working-directory: functions
        run: |
          node <<'NODE'
          const admin = require('firebase-admin');

          if (!admin.apps.length) {
            admin.initializeApp({ projectId: 'meteo-apprentissage' });
          }

          const db = admin.firestore();

          (async () => {
            const run = await db
              .collection('occupationContextStatsRuns')
              .doc('2026-10-04')
              .get();

            if (!run.exists) {
              throw new Error('Missing occupationContextStatsRuns/2026-10-04');
            }

            const data = run.data() || {};

            if (
              data.status !== 'ready' ||
              Number(data.departmentsProcessed || 0) !== 101 ||
              Number(data.occupationContexts || 0) <= 0
            ) {
              throw new Error(
                'Invalid Oct 4 context run: ' + JSON.stringify(data)
              );
            }

            console.log(JSON.stringify({
              ok: true,
              date: '2026-10-04',
              departmentsProcessed: data.departmentsProcessed,
              occupationContexts: data.occupationContexts,
              populationDepartmentsAvailable:
                data.populationDepartmentsAvailable,
            }, null, 2));
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Build updated calibration draft
        working-directory: functions
        run: node scripts/build-occupation-calibration.cjs
