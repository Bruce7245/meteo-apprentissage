name: Inspect Oct 5 recovery by department

on:
  push:
    branches:
      - feat/occupation-search-37
    paths:
      - .github/workflows/inspect-oct5-recovery-by-department.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - run: npm ci --prefix functions

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_FIREBASE_DEPLOYER_KEY }}

      - name: Measure recovery by department
        working-directory: functions
        run: |
          node <<'NODE'
          const { createHash } = require('node:crypto');
          const admin = require('firebase-admin');

          if (!admin.apps.length) {
            admin.initializeApp({ projectId: 'meteo-apprentissage' });
          }

          const db = admin.firestore();

          function normalizeDepartment(value) {
            const raw = String(value || '').trim().toUpperCase();
            if (/^\d$/.test(raw)) return `0${raw}`;
            if (/^(?:\d{2}|2A|2B|97[1-6])$/.test(raw)) return raw;
            return null;
          }

          function departmentFromPostalCode(value) {
            const postal = String(value || '').trim();
            if (/^97[1-6]\d{2}$/.test(postal)) return postal.slice(0, 3);
            if (/^20\d{3}$/.test(postal)) {
              const numeric = Number(postal);
              if (numeric >= 20000 && numeric <= 20199) return '2A';
              if (numeric >= 20200 && numeric <= 20699) return '2B';
              return null;
            }
            if (/^\d{5}$/.test(postal)) return postal.slice(0, 2);
            return null;
          }

          function offerDocId(value) {
            return createHash('sha256')
              .update(String(value || ''))
              .digest('hex');
          }

          async function loadInseeBySiret(sirets) {
            const unique = Array.from(
              new Set(
                sirets
                  .map((value) => String(value || '').trim())
                  .filter(Boolean)
              )
            );
            const output = new Map();

            for (let index = 0; index < unique.length; index += 30) {
              const chunk = unique.slice(index, index + 30);
              const refs = chunk.map((siret) =>
                db.collection('inseeEstablishments').doc(siret)
              );
              const snapshots = await db.getAll(...refs);

              for (const snapshot of snapshots) {
                if (snapshot.exists) {
                  output.set(snapshot.id, snapshot.data() || {});
                }
              }
            }

            return output;
          }

          (async () => {
            const obsSnap = await db
              .collection('jobOfferObservations')
              .where('date', '==', '2026-10-05')
              .get();

            const observations = obsSnap.docs.map((doc) => ({
              id: doc.id,
              ...(doc.data() || {}),
            }));

            const inseeBySiret = await loadInseeBySiret(
              observations.map((row) => row.workplaceSiret)
            );

            const stats = new Map();

            function bucket(code) {
              if (!stats.has(code)) {
                stats.set(code, {
                  departmentCode: code,
                  total: 0,
                  resolved: 0,
                  inDepartment: 0,
                  outOfDepartment: 0,
                  unresolved: 0,
                });
              }
              return stats.get(code);
            }

            for (let index = 0; index < observations.length; index += 30) {
              const chunk = observations.slice(index, index + 30);
              const refs = [];
              const rows = [];

              for (const observation of chunk) {
                const departmentCode =
                  normalizeDepartment(observation.departmentCode);
                const offerId = String(observation.offerId || '').trim();

                if (departmentCode) bucket(departmentCode).total += 1;

                if (!departmentCode || !offerId) {
                  rows.push({ observation, departmentCode, refIndex: null });
                  continue;
                }

                rows.push({
                  observation,
                  departmentCode,
                  offerId,
                  refIndex: refs.length,
                });

                refs.push(
                  db
                    .collection('dailyOfferSnapshots')
                    .doc('2026-10-06')
                    .collection('departments')
                    .doc(departmentCode)
                    .collection('offers')
                    .doc(offerDocId(offerId))
                );
              }

              const snapshots = refs.length > 0
                ? await db.getAll(...refs)
                : [];

              for (const row of rows) {
                if (!row.departmentCode) continue;

                const target = bucket(row.departmentCode);
                let actualDepartment = null;

                if (row.refIndex !== null) {
                  const snapshot = snapshots[row.refIndex];

                  if (snapshot?.exists) {
                    const offer = snapshot.data() || {};
                    actualDepartment =
                      normalizeDepartment(offer.effectiveDepartmentCode) ||
                      departmentFromPostalCode(offer.postalCode);
                  }
                }

                if (!actualDepartment) {
                  const siret = String(
                    row.observation.workplaceSiret || ''
                  ).trim();
                  const establishment = inseeBySiret.get(siret);

                  if (establishment) {
                    actualDepartment =
                      normalizeDepartment(establishment.departmentCode) ||
                      departmentFromPostalCode(establishment.postalCode);
                  }
                }

                if (!actualDepartment) {
                  target.unresolved += 1;
                  continue;
                }

                target.resolved += 1;

                if (actualDepartment === row.departmentCode) {
                  target.inDepartment += 1;
                } else {
                  target.outOfDepartment += 1;
                }
              }
            }

            const departments = Array.from(stats.values())
              .map((row) => ({
                ...row,
                recoveryRate: Number(
                  (row.resolved / Math.max(1, row.total)).toFixed(4)
                ),
              }))
              .sort(
                (a, b) =>
                  a.recoveryRate - b.recoveryRate ||
                  b.unresolved - a.unresolved ||
                  a.departmentCode.localeCompare(b.departmentCode)
              );

            const below90 = departments.filter(
              (row) => row.recoveryRate < 0.9
            );
            const below95 = departments.filter(
              (row) => row.recoveryRate < 0.95
            );

            console.log(JSON.stringify({
              departments: departments.length,
              below90Count: below90.length,
              below95Count: below95.length,
              worst15: departments.slice(0, 15),
              best5: departments.slice(-5),
            }, null, 2));
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE
