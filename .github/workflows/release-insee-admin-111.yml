name: Publier le suivi INSEE admin #111
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/release-insee-admin-111.yml

permissions:
  contents: read

concurrency:
  group: apprentices-frontend-production
  cancel-in-progress: false

jobs:
  release:
    name: Publier les regles admin et Hosting
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Valider le site et la securite
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run lint
          npm run test:ui:kpi
          npm run test:canva-prompt
          npm run build
          test -s dist/index.html
          grep -q 'match /adminJobs/inseeNationalBackgroundJob' firestore.rules
          grep -q 'allow read: if isAdmin()' firestore.rules
      - name: Authentifier le deploiement
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_FIREBASE_DEPLOYER_KEY }}
      - name: Deployer les regles Firestore
        run: npx --yes firebase-tools@latest deploy --project meteo-apprentissage --only firestore:rules --non-interactive
      - name: Deployer seulement Hosting
        run: npx --yes firebase-tools@latest deploy --project meteo-apprentissage --only hosting --non-interactive
      - name: Smoke test admin
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error --location --output /tmp/apprentifr-admin-insee.html --write-out "%{http_code}" --max-time 40 https://meteo-apprentissage.web.app/admin/entreprises)"
          test "$status" = "200"
          grep -q '<div id="root"></div>' /tmp/apprentifr-admin-insee.html
          echo "Admin Entreprises: HTTP $status"
      - name: Bilan
        if: always()
        shell: bash
        run: |
          {
            echo "## Publication Admin Entreprises"
            echo "- Commit $GITHUB_SHA"
            echo "- Scope : Firestore rules + Hosting uniquement"
            echo "- Aucun redeploiement des fonctions ou relance de collecte"
          } >> "$GITHUB_STEP_SUMMARY"
