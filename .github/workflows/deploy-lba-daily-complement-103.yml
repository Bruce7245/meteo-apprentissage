name: Deploy Function LBA complement 04h J-1 #103

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/deploy-lba-daily-complement-103.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lba-complement-deploy-103
  cancel-in-progress: false

jobs:
  deploy:
    name: Tests et deploiement complement 04h Paris
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Installer Functions et verifier Node
        shell: bash
        run: |
          set -euo pipefail
          npm ci --prefix functions
          node --check functions/index.js
          node --check functions/lba-daily-complement.cjs
          node --check functions/lib/lba-daily-complement-plan.cjs
          node --check functions/lib/lba-export-stream.cjs
          node --check functions/scripts/rollback-lba-daily-complement.cjs

      - name: Executer les tests de non regression
        run: npm run test:unit --prefix functions

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_FIREBASE_DEPLOYER_KEY }}

      - name: Deployer exclusivement Functions complement et gardes
        shell: bash
        run: |
          set -euo pipefail
          npx --yes firebase-tools@latest deploy \
            --project meteo-apprentissage \
            --only "functions:complementPreviousDayLbaOffers,functions:importDailyOffers,functions:importDailyOffersHttp,functions:backfillDailyOffers,functions:resumeOfferBackfillJob,functions:startOfferBackfillJobHttp,functions:getPublicDepartmentOffersHttp" \
            --non-interactive

      - name: Verifier que la Function 04h est bien deployee
        shell: bash
        run: |
          set -euo pipefail
          npx --yes firebase-tools@latest functions:list --project meteo-apprentissage > /tmp/apprentifr-functions-list.txt
          grep -q "complementPreviousDayLbaOffers" /tmp/apprentifr-functions-list.txt
          echo "Function quotidienne 04:00 Europe/Paris publiee sur Firebase."
