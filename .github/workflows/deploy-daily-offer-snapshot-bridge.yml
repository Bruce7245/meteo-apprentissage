# redeploy: forward LBA address string into snapshot projection
# redeploy: parse LBA address-only locations
# redeploy: deduplicate duplicate LBA offer rows before publication
name: Deploy daily offer snapshot bridge

on:
  push:
    branches:
      - feat/occupation-search-37
    paths:
      - .github/workflows/deploy-daily-offer-snapshot-bridge.yml

permissions:
  contents: read

concurrency:
  group: deploy-daily-offer-snapshot-bridge
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy daily offer import bridge
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install Functions dependencies
        run: npm ci --prefix functions

      - name: Validate Functions syntax
        run: node --check functions/index.js

      - name: Run Functions unit tests
        run: npm run test:unit --prefix functions

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_FIREBASE_DEPLOYER_KEY }}

      - name: Deploy targeted daily offer Functions
        run: >-
          npx --yes firebase-tools@latest deploy
          --project meteo-apprentissage
          --only
          "functions:importDailyOffers,functions:importDailyOffersHttp"
          --non-interactive
