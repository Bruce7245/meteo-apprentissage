name: Inspect official ROME domain tree

on:
  push:
    branches:
      - feat/occupation-search-37
    paths:
      - .github/workflows/inspect-rome-domain-tree.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      - name: Inspect workbook structure
        run: |
          node --input-type=module <<'NODE'
          import crypto from 'node:crypto';
          import XLSX from 'xlsx';

          const url =
            'https://www.data.gouv.fr/api/1/datasets/r/88342be1-06b8-4ab6-8ce9-83e117d21346';

          const response = await fetch(url, {
            headers: {
              Accept: '*/*',
              'User-Agent': 'ApprentiFR ROME domain tree inspector',
            },
          });

          if (!response.ok) {
            throw new Error(`HTTP ${response.status}`);
          }

          const buffer = Buffer.from(await response.arrayBuffer());
          const hash = crypto.createHash('sha256').update(buffer).digest('hex');
          const workbook = XLSX.read(buffer, { type: 'buffer' });

          const output = {
            bytes: buffer.length,
            sha256: hash,
            sheetNames: workbook.SheetNames,
            sheets: {},
          };

          for (const sheetName of workbook.SheetNames) {
            const sheet = workbook.Sheets[sheetName];
            const rows = XLSX.utils.sheet_to_json(sheet, {
              header: 1,
              raw: false,
              defval: null,
            });

            output.sheets[sheetName] = {
              ref: sheet['!ref'] || null,
              firstRows: rows.slice(0, 20),
            };
          }

          console.log(JSON.stringify(output, null, 2));
          NODE
