name: Deploy reconciled admin vigilance backend

on:
  workflow_dispatch:
    inputs:
      confirm_production:
        description: "Type DEPLOY to confirm production deployment"
        required: true
        default: ""
        type: string
      deploy_functions:
        description: "Deploy the 4 admin vigilance Functions"
        required: true
        default: false
        type: boolean
      deploy_rules:
        description: "Deploy Firestore rules"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  deploy:
    name: Controlled admin vigilance backend deploy
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20

    steps:
      - name: Enforce branch and confirmation
        shell: bash
        env:
          CONFIRM_PRODUCTION: ${{ inputs.confirm_production }}
        run: |
          set -euo pipefail

          if [ "$GITHUB_REF_NAME" != "feat/admin-vigilance-backend-58" ]; then
            echo "Deployment refused from branch: $GITHUB_REF_NAME" >&2
            exit 1
          fi

          if [ "$CONFIRM_PRODUCTION" != "DEPLOY" ]; then
            echo "Production deployment requires confirm_production=DEPLOY" >&2
            exit 1
          fi

      - name: Require at least one target
        shell: bash
        env:
          DEPLOY_FUNCTIONS: ${{ inputs.deploy_functions }}
          DEPLOY_RULES: ${{ inputs.deploy_rules }}
        run: |
          set -euo pipefail
          if [ "$DEPLOY_FUNCTIONS" != "true" ] && [ "$DEPLOY_RULES" != "true" ]; then
            echo "Select at least one deployment target." >&2
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install Functions dependencies
        run: npm ci --prefix functions

      - name: Validate backend before deploy
        working-directory: functions
        run: |
          set -euo pipefail
          node --check index.js
          node --check admin-occupation-vigilance-config.cjs
          node --check lib/occupation-search.cjs
          node --check lib/occupation-vigilance.cjs
          node --test             test/admin-occupation-vigilance-config.test.cjs             test/occupation-vigilance.test.cjs

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_FIREBASE_DEPLOYER_KEY }}

      - name: Deploy targeted Functions
        if: ${{ inputs.deploy_functions }}
        shell: bash
        run: |
          set -euo pipefail
          npx --yes firebase-tools@latest deploy             --project meteo-apprentissage             --only "functions:previewOccupationVigilanceConfigHttp,functions:getOccupationVigilanceConfigHistoryHttp,functions:compareOccupationVigilanceConfigsHttp,functions:activateOccupationVigilanceConfigHttp"             --non-interactive

      - name: Deploy Firestore rules
        if: ${{ inputs.deploy_rules }}
        shell: bash
        run: |
          set -euo pipefail
          npx --yes firebase-tools@latest deploy             --project meteo-apprentissage             --only firestore:rules             --non-interactive

      - name: Verify deployed Functions are protected
        if: ${{ inputs.deploy_functions }}
        shell: bash
        run: |
          set -euo pipefail

          check_401() {
            name="$1"
            url="$2"
            body_file="$(mktemp)"
            status="$(curl --silent --show-error               --output "$body_file"               --write-out "%{http_code}"               --max-time 30               --request POST               --header "Content-Type: application/json"               --data '{}'               "$url")"

            echo "$name -> HTTP $status"
            cat "$body_file"
            echo

            if [ "$status" != "401" ]; then
              echo "Unexpected status for $name: expected 401 without auth." >&2
              exit 1
            fi
          }

          check_401             "previewOccupationVigilanceConfigHttp"             "https://europe-west1-meteo-apprentissage.cloudfunctions.net/previewOccupationVigilanceConfigHttp"
          check_401             "getOccupationVigilanceConfigHistoryHttp"             "https://europe-west1-meteo-apprentissage.cloudfunctions.net/getOccupationVigilanceConfigHistoryHttp"
          check_401             "compareOccupationVigilanceConfigsHttp"             "https://europe-west1-meteo-apprentissage.cloudfunctions.net/compareOccupationVigilanceConfigsHttp"
          check_401             "activateOccupationVigilanceConfigHttp"             "https://europe-west1-meteo-apprentissage.cloudfunctions.net/activateOccupationVigilanceConfigHttp"

      - name: Deployment summary
        shell: bash
        env:
          DEPLOY_FUNCTIONS: ${{ inputs.deploy_functions }}
          DEPLOY_RULES: ${{ inputs.deploy_rules }}
        run: |
          {
            echo "## Reconciled admin vigilance backend deployment"
            echo
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Branch: \`$GITHUB_REF_NAME\`"
            echo "- Functions: \`$DEPLOY_FUNCTIONS\`"
            echo "- Firestore rules: \`$DEPLOY_RULES\`"
            echo
            echo "### Safety"
            echo "- No vigilance run triggered."
            echo "- No configuration activated."
            echo "- No scheduler modified."
            echo "- No public map recalculated."
            echo "- No Hosting deployment."
          } >> "$GITHUB_STEP_SUMMARY"
