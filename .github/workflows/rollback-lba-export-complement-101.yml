name: Rollback LBA export publication 09-10 (manual only)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Taper exactement ROLLBACK_2026_10_09"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-lba-export-complement-101
  cancel-in-progress: false

jobs:
  rollback:
    name: Restore metadata before the export activation
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    env:
      ROLLBACK_APPROVED: ${{ inputs.confirm }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: |
          test "$ROLLBACK_APPROVED" = "ROLLBACK_2026_10_09"
          npm ci --prefix functions
          node --check functions/scripts/rollback-lba-export-complement-2026-10-09.cjs
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_FIREBASE_DEPLOYER_KEY }}
      - run: node functions/scripts/rollback-lba-export-complement-2026-10-09.cjs
