name: Verifier complement LBA en staging #101

on:
  push:
    branches:
      - feat/lba-export-reconciliation-101
    paths:
      - .github/workflows/verify-lba-export-complement-101.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Installer Firebase Admin
        run: npm ci --prefix functions

      - name: Authentifier Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_FIREBASE_DEPLOYER_KEY }}

      - name: Verifier 101 departements et ancienne photographie
        run: |
          set -euo pipefail
          node --check functions/scripts/verify-lba-export-complement.cjs
          node functions/scripts/verify-lba-export-complement.cjs
