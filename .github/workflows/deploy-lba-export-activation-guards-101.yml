name: Deploy protections for LBA export activation #101

on:
  push:
    branches:
      - feat/lba-export-reconciliation-101
    paths:
      - .github/workflows/deploy-lba-export-activation-guards-101.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-apprentifr-lba-export-guard-101
  cancel-in-progress: false

jobs:
  deploy-guards:
    name: Protect scheduled importer and public statistics before activation
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 35

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Installer les dependances
        run: npm ci --prefix functions

      - name: Syntaxe et suite de non-regression
        run: |
          set -euo pipefail
          node --check functions/index.js
          node --check functions/lba-daily-offers.js
          node --check functions/admin-national-stats.cjs
          node --check functions/scripts/activate-lba-export-complement-2026-10-09.cjs
          npm run test:unit --prefix functions

      - name: Authentifier Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_FIREBASE_DEPLOYER_KEY }}

      - name: Deployer exclusivement les gardes et lecteurs utiles
        run: |
          set -euo pipefail
          npx --yes firebase-tools@latest deploy \
            --project meteo-apprentissage \
            --only "functions:importDailyOffers,functions:importDailyOffersHttp,functions:backfillDailyOffers,functions:resumeOfferBackfillJob,functions:startOfferBackfillJobHttp,functions:getPublicDepartmentOffersHttp,functions:getAdminNationalStatsHttp" \
            --non-interactive

      - name: Verifier la politique HTTP de l'admin
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error \
            --output /tmp/apprentifr-export-admin-response \
            --write-out "%{http_code}" \
            --max-time 40 \
            --request POST \
            --header "Content-Type: application/json" \
            --data '{"days":7}' \
            "https://europe-west1-meteo-apprentissage.cloudfunctions.net/getAdminNationalStatsHttp")"
          echo "Admin stats sans authentification HTTP $status"
          test "$status" = "401"

      - name: Verifier la disponibilite de la page publique des offres
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error \
            --output /tmp/apprentifr-public-offers-response \
            --write-out "%{http_code}" \
            --max-time 40 \
            "https://europe-west1-meteo-apprentissage.cloudfunctions.net/getPublicDepartmentOffersHttp?department=72&limit=3")"
          echo "Offres publiques Sarthe HTTP $status"
          test "$status" = "200"
